# Tool settings only; the app is built and installed with Meson.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# PyGObject 3.56 itself uses asyncio APIs Python 3.14 deprecates; not our code
filterwarnings = ["ignore::DeprecationWarning:gi\\..*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
